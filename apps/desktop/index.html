<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer never loads remote code. The hosts it may reach are injected
      at build time from VITE_CONNECT_SRC / VITE_IMG_SRC, because a packaged
      build talks to a real server and a development build talks to localhost -
      hard-coding either one breaks the other.

      See .env.development and .env.production.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: %VITE_IMG_SRC%; media-src 'self' blob:; connect-src 'self' %VITE_CONNECT_SRC%"
    />
    <!--
      The same renderer is also the web client at /app, where a browser tab
      without an icon is conspicuous. Relative, like every other asset here, so
      it survives both file:// in Electron and a path prefix on the site.

      src/assets rather than build/: build/ is generated by `npm run logo` and
      gitignored, so it is absent in the Docker build that produces the web
      client - and Vite answers a missing asset by leaving the URL alone and
      exiting zero, which ships a 404 rather than failing.
    -->
    <link rel="icon" type="image/png" href="./src/assets/icon.png" />
    <title>ChitChak</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
