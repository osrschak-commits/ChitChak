appId: com.chitchak.desktop
productName: ChitChak
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# Only the built output ships. The renderer is bundled by Vite and the main
# process by esbuild, so node_modules is not needed inside the package - which
# keeps the installer small and avoids shipping dev dependencies.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# Where the app looks for updates, and where `npm run release` uploads them.
#
# A plain directory of files behind Caddy rather than a hosted service: the
# desktop app fetches latest.yml, compares the version to its own, and pulls the
# installer if it is newer. Nothing to run, nothing to authenticate against.
publish:
  - provider: generic
    url: https://api.chitchak.com/updates
    channel: latest
    # latest.yml carries a sha512 of the installer and electron-updater refuses
    # a download that does not match, so a corrupted or truncated transfer is
    # caught. That is an integrity check, not an authenticity one: it proves the
    # file matches the manifest, and HTTPS is what makes the manifest itself
    # trustworthy. Code signing would be the missing piece.

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Skips the winCodeSign toolchain download.
  #
  # That package contains macOS symlinks, and extracting a symlink on Windows
  # needs a privilege a normal user account does not have - so the build fails
  # on the download, before it ever gets to packaging. We are not signing
  # anything, so the toolchain is dead weight.
  #
  # The cost is that the inner app .exe keeps Electron's default icon; the
  # installer, Start Menu entry and desktop shortcut all still use ours. To get
  # the inner icon too, turn on Windows Developer Mode (Settings > System > For
  # developers), which grants the symlink privilege, and set this back to true.
  signAndEditExecutable: false

nsis:
  # A one-click installer that picks its own location and launches immediately
  # is exactly the behaviour that makes people distrust an unsigned download.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChitChak
  # Named so the download is obviously what it claims to be.
  artifactName: ChitChak-Setup-${version}.${ext}

mac:
  icon: build/icon.icns
  category: public.app-category.social-networking
  # The Windows installer's shape plus the architecture, because on macOS the
  # architecture is the one thing the person downloading has to get right.
  # Naming it explicitly also stops electron-builder dropping "x64" from the
  # default name, which it does for the default architecture only - leaving the
  # two files looking like they are for different things.
  artifactName: ChitChak-${version}-${arch}.${ext}
  # Two separate builds rather than one universal binary. A universal .dmg is
  # ~190 MB because it carries both architectures; nearly every Mac in use is
  # Apple Silicon, so this keeps the common download at ~95 MB and gives Intel
  # its own file. The docs say which is which.
  target:
    - target: dmg
      arch: [arm64, x64]
    # electron-updater on macOS installs from a zip, never a dmg - Squirrel.Mac
    # swaps the .app bundle in place. Removing this target would not just drop a
    # file from the release, it would drop updates entirely.
    - target: zip
      arch: [arm64, x64]

  # macOS refuses microphone and camera access unless the bundle declares, in
  # words, why it wants them - and the refusal is a hard crash the first time
  # the app asks, not a dialog the user can decline. These strings are what the
  # system prompt shows, and what stays visible in Settings > Privacy afterwards.
  extendInfo:
    NSMicrophoneUsageDescription: ChitChak needs your microphone so you can talk in voice channels.
    NSCameraUsageDescription: ChitChak needs your camera so you can turn video on in a call.
    NSHighResolutionCapable: true

  # Both of these only mean anything with an Apple Developer ID, which this
  # build does not have. Hardened runtime without notarisation buys nothing and
  # can only break media access; asking to notarise without a certificate fails
  # the build outright.
  hardenedRuntime: false
  notarize: false
  # `identity` is deliberately absent. Left alone, electron-builder ad-hoc signs
  # the arm64 build, which Apple Silicon requires before it will run a binary at
  # all. Setting `identity: null` turns that off and produces a .app that cannot
  # launch on any M-series Mac.

dmg:
  title: ChitChak ${version}

# The build is not code-signed on either platform.
#
# Windows: SmartScreen warns on first run until the download builds reputation.
# Tell people to expect it rather than letting them be surprised.
#
# macOS: Gatekeeper refuses the app outright - "ChitChak is damaged and can't be
# opened" - because it arrives quarantined with no Developer ID. Right-click >
# Open no longer clears that on current macOS; `xattr -dr com.apple.quarantine
# /Applications/ChitChak.app` does. The same missing signature is why
# Squirrel.Mac cannot install updates - it verifies what it downloaded against
# the running app's signature - so on macOS the updater offers a download link
# instead of updating silently.
#
# Certificates fix both: ~£200/year for Windows, $99/year for Apple.
