<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChitChak — Checkout</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <!--
      Paddle's default payment link.

      Paddle Billing has no fully hosted checkout: creating a transaction gives
      back this page's URL with `?_ptxn=txn_...` on the end, and it is this page
      that opens the overlay. So the app's "pay in a real browser" arrangement
      still holds - the desktop app opens a link, and the card details are typed
      somewhere with a visible address bar.

      The token below is a *client-side* token, which is public by design and
      does nothing except identify the account to Paddle.js. It is fetched from
      the API rather than compiled in, so rotating it does not need the site
      rebuilding.
    -->
    <style>
      .pay {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        text-align: center;
      }
      .pay__inner {
        max-width: 420px;
      }
      .pay__mark {
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.28em;
        color: var(--brass-400);
        margin-bottom: 24px;
      }
      .pay__title {
        font-size: 22px;
        margin: 0 0 10px;
        color: var(--text-bright);
      }
      .pay__body {
        color: var(--text-secondary, #9d98a8);
        line-height: 1.55;
        margin: 0;
      }
      .pay__error {
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px solid var(--line-strong, #363340);
        border-radius: 8px;
        color: var(--text-secondary, #9d98a8);
        font-size: 13px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <main class="pay">
      <div class="pay__inner">
        <div class="pay__mark">CHITCHAK</div>
        <h1 class="pay__title" id="title">Opening the checkout…</h1>
        <p class="pay__body" id="body">This takes a moment.</p>
        <div class="pay__error" id="error" hidden></div>
      </div>
    </main>

    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <script>
      (async () => {
        const title = document.getElementById('title');
        const body = document.getElementById('body');
        const error = document.getElementById('error');

        const say = (heading, text, detail) => {
          title.textContent = heading;
          body.textContent = text;
          if (detail) {
            error.textContent = detail;
            error.hidden = false;
          }
        };

        const transactionId = new URLSearchParams(location.search).get('_ptxn');
        if (!transactionId) {
          // Somebody has arrived here directly rather than from the app. Not an
          // error worth alarming them about - just nothing to do.
          say(
            'Nothing to pay for',
            'Open ChitChak and choose something from the store, and this page will do the rest.',
          );
          return;
        }

        let settings;
        try {
          const response = await fetch('https://api.chitchak.com/api/premium/paddle-client');
          if (!response.ok) throw new Error('HTTP ' + response.status);
          settings = await response.json();
        } catch (problem) {
          say(
            'Could not reach ChitChak',
            'The checkout needs to ask our server for a setting first. Try again in a moment.',
            String(problem),
          );
          return;
        }

        if (!settings.token) {
          say(
            'Checkout is not set up yet',
            'Buying is not switched on for this server. Nothing has been charged.',
          );
          return;
        }

        try {
          if (settings.environment === 'sandbox') Paddle.Environment.set('sandbox');
          Paddle.Initialize({
            token: settings.token,
            eventCallback: (event) => {
              if (event.name === 'checkout.completed') {
                say(
                  'Thank you',
                  'That is done. Your keys appear in ChitChak within a few seconds — you can close this tab.',
                );
              }
            },
          });
          Paddle.Checkout.open({ transactionId });
          say('Checkout is open', 'Finish paying in the panel, then come back to ChitChak.');
        } catch (problem) {
          say(
            'Could not open the checkout',
            'Nothing has been charged. Try again from the app.',
            String(problem),
          );
        }
      })();
    </script>
  </body>
</html>
